{% if user.is_authenticated %}
  <div class="barra-sesion">
    <span>Sesión iniciada: {{ nombre_usuario_sesion|default:user.get_username }}</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit">Cerrar sesión</button>
    </form>
  </div>
{% endif %}
