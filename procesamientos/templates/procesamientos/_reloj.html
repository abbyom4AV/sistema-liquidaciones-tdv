<div class="reloj-dia reloj-cabecera" id="tdv-reloj" data-ciclo="dia" aria-live="polite">
  <div class="reloj-ilustracion" aria-hidden="true">
    <svg class="reloj-svg reloj-sol" viewBox="0 0 64 64" width="40" height="40">
      <circle class="sol-halo" cx="32" cy="32" r="18" fill="#F6EBD7" opacity="0.55"/>
      <g class="sol-rayos" fill="none" stroke="#C9B896" stroke-width="1.6" stroke-linecap="round">
        <path d="M32 8 L32 13"/>
        <path d="M32 51 L32 56"/>
        <path d="M8 32 L13 32"/>
        <path d="M51 32 L56 32"/>
        <path d="M14.8 14.8 L18.3 18.3"/>
        <path d="M45.7 45.7 L49.2 49.2"/>
        <path d="M49.2 14.8 L45.7 18.3"/>
        <path d="M18.3 45.7 L14.8 49.2"/>
      </g>
      <circle class="sol-disco" cx="32" cy="32" r="9.5" fill="#E8D5B0" stroke="#D2BE96" stroke-width="1"/>
    </svg>
    <svg class="reloj-svg reloj-luna" viewBox="0 0 64 64" width="40" height="40">
      <circle class="luna-halo" cx="32" cy="32" r="18" fill="#E8EAF6" opacity="0.7"/>
      <g class="luna-estrellas" fill="#9AA3C7">
        <circle cx="14" cy="16" r="1.1"/>
        <circle cx="48" cy="20" r="0.9"/>
        <circle cx="46" cy="46" r="1"/>
      </g>
      <path class="luna-disco"
        d="M37 14c-8.2 1.1-14.4 8.1-14.4 16.6S28.8 46 37 47.2C29.2 49.5 22 42.4 22 33.5S29.2 16.6 37 14z"
        fill="#D7DCF0" stroke="#B8C0DC" stroke-width="1"/>
    </svg>
  </div>
  <div class="reloj-texto">
    <strong class="reloj-saludo" id="tdv-reloj-saludo">—</strong>
    <span class="reloj-fecha" id="tdv-reloj-fecha">—</span>
    <span class="reloj-hora" id="tdv-reloj-hora">—</span>
  </div>
</div>
<script>
(function () {
  var root = document.getElementById("tdv-reloj");
  if (!root) return;
  var saludoEl = document.getElementById("tdv-reloj-saludo");
  var fechaEl = document.getElementById("tdv-reloj-fecha");
  var horaEl = document.getElementById("tdv-reloj-hora");
  var dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
  var meses = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
  function pad(n) { return n < 10 ? "0" + n : String(n); }
  function tick() {
    var now = new Date();
    var h = now.getHours();
    root.setAttribute("data-ciclo", (h >= 6 && h < 19) ? "dia" : "noche");
    saludoEl.textContent = h < 12 ? "Buenos días" : (h < 19 ? "Buenas tardes" : "Buenas noches");
    fechaEl.textContent = dias[now.getDay()] + ", " + now.getDate() + " " + meses[now.getMonth()];
    horaEl.textContent = pad(h) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
